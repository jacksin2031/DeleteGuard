name: CI

on:
  push:
    branches: [main, feature/mvp, feature/minifilter-v0.2, feature/interactive-approval-v0.2.1, feature/runtime-validation-v0.2.2]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate test-VM PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $allErrors = @()
          Get-ChildItem -Path scripts\testvm -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              foreach ($parseError in $parseErrors) {
                $allErrors += "$($_.Name): $($parseError.Message) at $($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber)"
              }
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Write-Error
            exit 1
          }
      - name: Native tests (bulk-delete rate limiter, compiled with MSVC /W4 /WX)
        shell: pwsh
        run: ./tests/native/run-native-tests.ps1
      - name: Compile test-VM native probes (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Add-Type -Path .\scripts\testvm\HardLinkProbe.cs
          if (-not ('DeleteGuardHardLinkProbe' -as [type])) {
            Write-Error 'HardLinkProbe.cs did not produce DeleteGuardHardLinkProbe.'
            exit 1
          }
      - name: Smoke test test-VM destructive path boundary
        shell: powershell
        run: |
          . .\scripts\testvm\TestVm.Common.ps1
          Assert-DeleteGuardSafeTestPath -Path 'C:\DeleteGuard-VMTest'
          Assert-DeleteGuardSafeTestPath -Path 'C:\DeleteGuard-VMTest\safe-child\file.txt'
          $outsideWasRejected = $false
          try {
            Assert-DeleteGuardSafeTestPath -Path 'C:\Windows'
          }
          catch {
            $outsideWasRejected = $true
          }
          if (-not $outsideWasRejected) {
            Write-Error 'Safety boundary accepted C:\Windows unexpectedly.'
            exit 1
          }
      - name: Restore
        run: dotnet restore DeleteGuard.sln
      - name: Build
        run: dotnet build DeleteGuard.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/DeleteGuard.Core.Tests/DeleteGuard.Core.Tests.csproj -c Release --no-build
      - name: Package win-x64
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Runtime win-x64
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

  build-minifilter:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Build unsigned x64 minifilter
        shell: pwsh
        run: ./scripts/build-driver.ps1 -Configuration Release
      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-minifilter-x64-unsigned
          path: artifacts/driver-x64/
          if-no-files-found: error

  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # A representative subset keeps CI time/storage bounded; run the script without -Cultures for all ten.
      - name: Build MSI installers (unsigned)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Configuration Release -Cultures en-US,zh-TW,ja-JP
      - name: Verify the MSI contents are complete and the self-contained CLI runs
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts/installer -Filter 'DeleteGuard-*-x64-en-US.msi' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'dg-admin-install'
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($p.ExitCode)" }
          foreach ($name in 'deleteguard.exe', 'DeleteGuard.Broker.exe', 'DeleteGuard.Agent.exe', 'DeleteGuard.EventRelay.exe') {
            if (-not (Get-ChildItem $target -Recurse -Filter $name)) { throw "$name is missing from the MSI" }
          }
          $cli = Get-ChildItem $target -Recurse -Filter deleteguard.exe | Select-Object -First 1
          & $cli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'The extracted CLI did not run.' }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-installers-unsigned
          path: artifacts/installer/*.msi
          if-no-files-found: error
