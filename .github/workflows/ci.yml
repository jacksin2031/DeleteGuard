name: CI

on:
  push:
    branches: [main, feature/mvp]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DeleteGuard.sln
      - name: Build
        run: dotnet build DeleteGuard.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/DeleteGuard.Core.Tests/DeleteGuard.Core.Tests.csproj -c Release --no-build
      - name: Package win-x64
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Runtime win-x64
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
