name: CI

on:
  push:
    branches: [main, feature/mvp, feature/minifilter-v0.2, feature/interactive-approval-v0.2.1]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DeleteGuard.sln
      - name: Build
        run: dotnet build DeleteGuard.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/DeleteGuard.Core.Tests/DeleteGuard.Core.Tests.csproj -c Release --no-build
      - name: Test VM acceptance harness guards (no driver operations)
        shell: pwsh
        run: ./scripts/Test-VmAcceptance.ps1 -Mode SelfTest
      - name: Package win-x64
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Runtime win-x64
      - name: Test acceptance helpers on generated unprotected fixtures
        shell: pwsh
        run: ./scripts/vm-tests/Test-HarnessHelpers.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

  build-minifilter:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - name: Build unsigned x64 minifilter
        shell: pwsh
        run: ./scripts/build-driver.ps1 -Configuration Release
      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v4
        with:
          name: DeleteGuard-minifilter-x64-unsigned
          path: artifacts/driver-x64/
          if-no-files-found: error
